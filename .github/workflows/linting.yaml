name: Linting

on: pull_request

jobs:
  eslint:
    name: Eslint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/jod

      - run: corepack enable

      - run: rm -rf node_modules && yarn install --immutable

      - run: yarn run lint:eslint:check
  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/jod

      - run: corepack enable

      - run: rm -rf node_modules && yarn install --immutable

      - run: yarn run lint:prettier:check

  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: lts/jod

      - run: corepack enable

      - run: rm -rf node_modules && yarn install --immutable

      - run: yarn commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
